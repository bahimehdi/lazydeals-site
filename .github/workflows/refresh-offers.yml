name: Publish LazyDeals site and current offers

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lazydeals-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare static artifact and current reports
        run: |
          mkdir -p _site
          cp index.html site.css tokens.css robots.txt sitemap.xml offers.js offers-data.mjs motion.js contact.js _site/
          cp -R assets help vendor _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
          node scripts/build-offers.mjs _site/offers.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
